name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: statux-darwin-arm64
          - os: macos-latest
            target: bun-darwin-x64
            artifact: statux-darwin-x64
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: statux-linux-x64
          - os: ubuntu-latest
            target: bun-linux-arm64
            artifact: statux-linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun build --compile --target ${{ matrix.target }} --outfile ${{ matrix.artifact }} src/cli.ts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create checksums
        run: |
          cd dist
          for dir in */; do
            artifact="${dir%/}"
            chmod +x "$artifact/$artifact"
            (cd "$artifact" && sha256sum "$artifact" > "$artifact.sha256")
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/statux-darwin-arm64/statux-darwin-arm64
            dist/statux-darwin-arm64/statux-darwin-arm64.sha256
            dist/statux-darwin-x64/statux-darwin-x64
            dist/statux-darwin-x64/statux-darwin-x64.sha256
            dist/statux-linux-x64/statux-linux-x64
            dist/statux-linux-x64/statux-linux-x64.sha256
            dist/statux-linux-arm64/statux-linux-arm64
            dist/statux-linux-arm64/statux-linux-arm64.sha256

  npm-publish:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Publish to npm
        run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
